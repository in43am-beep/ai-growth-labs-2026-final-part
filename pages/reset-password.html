<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | RankForge AI</title>
  <meta name="description" content="Reset your RankForge AI account password.">
  <link rel="canonical" href="https://YOUR_DOMAIN_HERE/pages/reset-password.html">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../index.html" class="nav-logo">Rank<span>Forge</span>AI</a>
        <div class="auth-nav-actions">
          <a href="login.html" class="btn btn-outline">Sign In</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <div id="form-alert" class="error-message" role="alert" style="display:none"></div>

      <form id="reset-form" novalidate>
        <div class="form-row">
          <label for="password">New password <span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="error-message" data-for="password"></span>
        </div>
        <div class="form-row">
          <label for="confirm_password">Confirm new password <span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="confirm_password" aria-label="Show password">Show</button>
          </div>
          <span class="error-message" data-for="confirm_password"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Reset Password →</button>
      </form>

      <p class="auth-foot"><a href="login.html">Back to sign in</a></p>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    (function () {
      var API = (window.API_BASE || '');
      var qs = new URLSearchParams(window.location.search);
      var token = qs.get('token') || '';
      var alertEl = document.getElementById('form-alert');
      function showAlert(msg, type) {
        alertEl.textContent = msg; alertEl.style.display = 'block';
        alertEl.className = (type === 'success' ? 'success-message' : 'error-message');
      }
      // password show/hide toggles
      document.querySelectorAll('.pw-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.dataset.target);
          if (!input) return;
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.textContent = show ? 'Hide' : 'Show';
        });
      });
      if (!token) { showAlert('Invalid or missing reset link. Please request a new one.', 'error'); }
      document.getElementById('reset-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = document.getElementById('password').value;
        var cf = document.getElementById('confirm_password').value;
        if (pw.length < 8) { showAlert('Password must be at least 8 characters.', 'error'); return; }
        if (pw !== cf) { showAlert('Passwords do not match.', 'error'); return; }
        if (!token) { showAlert('Invalid or missing reset link.', 'error'); return; }
        var btn = document.getElementById('submit-btn');
        btn.disabled = true; var lbl = btn.textContent; btn.textContent = 'Resetting…';
        fetch(API + '/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pw })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok) {
              showAlert((res.data.message || 'Password reset.') + ' Redirecting to sign in…', 'success');
              setTimeout(function () { window.location.href = 'login.html'; }, 1800);
            } else {
              showAlert(res.data.error || res.data.detail || 'Could not reset password. The link may have expired.', 'error');
              btn.disabled = false; btn.textContent = lbl;
            }
          }).catch(function () {
            showAlert('Network error. Please try again.', 'error');
            btn.disabled = false; btn.textContent = lbl;
          });
      });
    })();
  </script>
</body>
</html>
