<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Free Account | RankForge AI</title>
  <meta name="description" content="Sign up for a free RankForge AI account to request SEO audits, track your projects, and grow your local business online.">
  <link rel="canonical" href="https://YOUR_DOMAIN_HERE/pages/signup.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:title" content="Create Your Free Account | RankForge AI">
  <meta property="og:description" content="Sign up for a free RankForge AI account to grow your local business online.">
  <meta property="og:url" content="https://YOUR_DOMAIN_HERE/pages/signup.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Create Your Free Account | RankForge AI">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../index.html" class="nav-logo">Rank<span>Forge</span>AI</a>
        <div class="auth-nav-actions">
          <a href="login.html" class="btn btn-outline">Sign In</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your free account</h1>
      <p class="auth-sub">Join hundreds of local businesses growing with RankForge AI.</p>

      <div id="form-alert" class="error-message" role="alert" style="display:none"></div>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <label for="full_name">Full Name <span class="req">*</span></label>
          <input type="text" id="full_name" name="full_name" autocomplete="name" required>
          <span class="error-message" data-for="full_name"></span>
        </div>
        <div class="form-row">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <span class="error-message" data-for="email"></span>
        </div>
        <div class="form-row">
          <label for="phone">Phone <span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+1 800 971 0199" required>
          <span class="error-message" data-for="phone"></span>
        </div>
        <div class="form-row">
          <label for="password">Password <span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button>
          </div>
          <div class="pw-strength"><span id="pw-bar"></span></div>
          <span class="error-message" data-for="password"></span>
        </div>
        <div class="form-row">
          <label for="confirm_password">Confirm Password <span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="confirm_password" aria-label="Show password">Show</button>
          </div>
          <span class="error-message" data-for="confirm_password"></span>
        </div>
        <div class="form-row">
          <label for="business_name">Business Name <span class="req">*</span></label>
          <input type="text" id="business_name" name="business_name" autocomplete="organization" required>
          <span class="error-message" data-for="business_name"></span>
        </div>
        <div class="form-row">
          <label for="website_url">Website URL</label>
          <input type="url" id="website_url" name="website_url" placeholder="https://example.com">
        </div>
        <div class="form-row">
          <label for="industry">Industry</label>
          <select id="industry" name="industry">
            <option value="">Select your industry</option>
            <option>Dental / Medical</option>
            <option>Legal / Law Firm</option>
            <option>Home Services (HVAC, Plumbing, Roofing)</option>
            <option>Restaurant / Food</option>
            <option>Real Estate</option>
            <option>Automotive</option>
            <option>Beauty / Salon / Spa</option>
            <option>Fitness / Gym</option>
            <option>Professional Services</option>
            <option>E-commerce / Retail</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-row form-check">
          <label><input type="checkbox" id="agree" name="agree" required> I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms</a> &amp; <a href="privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a> <span class="req">*</span></label>
          <span class="error-message" data-for="agree"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Free Account →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="btn btn-google btn-block" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>

      <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => RankAuth.initSignup());
  </script>
</body>
</html>
