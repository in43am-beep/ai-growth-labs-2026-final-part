<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard | RankForge AI</title>
  <meta name="description" content="Your RankForge AI account dashboard — view your audit requests and manage your profile.">
  <link rel="canonical" href="https://YOUR_DOMAIN_HERE/pages/dashboard-user.html">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../index.html" class="nav-logo">Rank<span>Forge</span>AI</a>
        <div class="auth-nav-actions">
          <a href="free-audit.html" class="btn btn-outline">Free Audit →</a>
          <button type="button" id="logout-btn" class="btn btn-primary">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="user-dash container">
    <section class="dash-welcome">
      <h1>Welcome, <span id="user-name">there</span> 👋</h1>
      <p class="auth-sub">Here's an overview of your RankForge AI account.</p>
    </section>

    <div class="dash-grid">
      <section class="dash-panel">
        <h2>My Audit Requests</h2>
        <div id="audit-list" class="audit-list">
          <p class="muted">Loading…</p>
        </div>
        <a href="free-audit.html" class="btn btn-primary" style="margin-top:16px">Request a New Audit →</a>
      </section>

      <section class="dash-panel">
        <h2>Account Details</h2>
        <form id="profile-form">
          <div class="form-row">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name">
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled>
          </div>
          <div class="form-row">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
          </div>
          <div class="form-row">
            <label for="business_name">Business Name</label>
            <input type="text" id="business_name" name="business_name">
          </div>
          <div class="form-row">
            <label for="website_url">Website URL</label>
            <input type="url" id="website_url" name="website_url">
          </div>
          <div class="form-row">
            <label for="industry">Industry</label>
            <input type="text" id="industry" name="industry">
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </section>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => RankAuth.initDashboard());
  </script>
</body>
</html>
