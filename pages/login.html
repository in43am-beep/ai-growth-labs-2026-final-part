<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | RankForge AI</title>
  <meta name="description" content="Sign in to your RankForge AI account to manage your SEO projects, audits, and account details.">
  <link rel="canonical" href="https://YOUR_DOMAIN_HERE/pages/login.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:title" content="Sign In | RankForge AI">
  <meta property="og:description" content="Sign in to your RankForge AI account.">
  <meta property="og:url" content="https://YOUR_DOMAIN_HERE/pages/login.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In | RankForge AI">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../index.html" class="nav-logo">Rank<span>Forge</span>AI</a>
        <div class="auth-nav-actions">
          <a href="signup.html" class="btn btn-outline">Create Account</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to manage your SEO projects and account.</p>

      <div id="form-alert" class="error-message" role="alert" style="display:none"></div>

      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <span class="error-message" data-for="email"></span>
        </div>
        <div class="form-row">
          <label for="password">Password <span class="req">*</span></label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="error-message" data-for="password"></span>
        </div>
        <div class="form-row form-check form-check-row">
          <label><input type="checkbox" id="remember" name="remember"> Remember me</label>
          <a href="#" id="forgot-link" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign In →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="btn btn-google btn-block" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>

      <p class="auth-foot">Don't have an account? <a href="signup.html">Create one free</a></p>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => RankAuth.initLogin());
  </script>
</body>
</html>
