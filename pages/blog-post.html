<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">Article | RankForge AI</title>
  <meta name="description" id="meta-desc" content="Read the latest SEO insights from RankForge AI.">
  <link rel="canonical" href="https://YOUR_DOMAIN_HERE/pages/blog-post.html">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="application/ld+json" id="article-schema"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../index.html" class="nav-logo">Rank<span>Forge</span>AI</a>
        <div class="auth-nav-actions">
          <a href="blog.html" class="btn btn-outline">← All Articles</a>
          <a href="free-audit.html" class="btn btn-primary">Free Audit →</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:820px;padding:120px 20px 60px;">
    <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-bottom:24px;font-size:0.85rem;color:#64748B;">
      <a href="../index.html">Home</a> / <a href="blog.html">Blog</a> / <span id="bc-title">Article</span>
    </nav>
    <article id="post" class="legal-content">
      <p class="muted">Loading article…</p>
    </article>
    <section class="cta-section" style="margin-top:48px;border-radius:16px;">
      <div class="container">
        <h2>Want Personalized Growth Advice?</h2>
        <p>Get a free audit and custom strategy for your business.</p>
        <a href="free-audit.html" class="btn btn-white">Get Your Free Audit →</a>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    var postEl = document.getElementById('post');
    if (!slug) { postEl.innerHTML = '<p>Article not found. <a href="blog.html">Back to blog</a></p>'; return; }

    function render(p) {
      document.getElementById('meta-title').textContent = (p.seo_title || p.title) + ' | RankForge AI';
      document.getElementById('meta-desc').setAttribute('content', p.seo_description || p.excerpt || '');
      document.getElementById('bc-title').textContent = p.title;
      var date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'}) : '';
      var img = p.featured_image ? '<img src="' + p.featured_image + '" alt="' + p.title + '" loading="lazy" style="width:100%;border-radius:14px;margin:20px 0;">' : '';
      postEl.innerHTML = '<h1>' + p.title + '</h1>' +
        '<div class="blog-card-meta" style="margin-bottom:8px;">' + (p.author||'RankForge AI') + (date ? ' &middot; ' + date : '') + (p.category ? ' &middot; ' + p.category : '') + '</div>' +
        img + '<div class="post-body">' + (p.body || p.excerpt || '') + '</div>';
      var schema = {
        "@context": "https://schema.org", "@type": "Article",
        "headline": p.title, "description": p.seo_description || p.excerpt || "",
        "author": {"@type": "Organization", "name": p.author || "RankForge AI"},
        "publisher": {"@type": "Organization", "name": "RankForge AI"},
        "datePublished": p.published_at || ""
      };
      document.getElementById('article-schema').textContent = JSON.stringify(schema);
    }

    fetch((window.API_BASE || '') + '/api/blog/posts/' + encodeURIComponent(slug))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (res) {
        if (res && res.post) { render(res.post); return; }
        // fallback to static JSON
        return fetch('../data/blog-posts.json').then(function (r) { return r.json(); }).then(function (d) {
          var p = (d.posts || []).find(function (x) { return x.slug === slug; });
          if (p) {
            if (p.url) { window.location.href = p.url; return; }
            render(p);
          } else {
            postEl.innerHTML = '<p>Article not found. <a href="blog.html">Back to blog</a></p>';
          }
        });
      })
      .catch(function () { postEl.innerHTML = '<p>Could not load this article. <a href="blog.html">Back to blog</a></p>'; });
  })();
  </script>
</body>
</html>
