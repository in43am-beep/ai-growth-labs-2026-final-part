worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # FastAPI upstream
    upstream app_server { server 127.0.0.1:8000; }

    server {
        listen 8080;
        server_name _;
        root /app;
        index index.html;

        # Health check proxied to FastAPI
        location = /health { proxy_pass http://app_server; }

        # API + dynamic app routes -> FastAPI
        location /api/        { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /dashboard   { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /admin       { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /login       { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /logout      { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /client      { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /settings    { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }
        location /static/     { proxy_pass http://app_server; include /etc/nginx/proxy_headers.conf; }

        # Cache headers for static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri @app;
        }

        # Static HTML / files, fall back to FastAPI then 404
        location / {
            try_files $uri $uri/ @app;
        }

        # Fall back to FastAPI for anything not found on disk
        location @app {
            proxy_pass http://app_server;
            include /etc/nginx/proxy_headers.conf;
        }

        # Custom 404
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
