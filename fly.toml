app = 'growth-labs-seo-calling-agent'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  FRONTEND_DIR = '/app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
